<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업무 종합 대시보드 - 로그인</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Pretendard', 'Inter', sans-serif;
      background: linear-gradient(135deg, #1B1F3B 0%, #0F1117 50%, #1B1F3B 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #E4E6F0;
    }
    .login-container {
      background: #1A1D2E;
      border-radius: 24px;
      padding: 48px;
      width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      text-align: center;
    }
    .logo {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #4F6AFF, #22D3A7);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 24px; color: white; font-weight: 700;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: #8E92A4; font-size: 14px; margin-bottom: 36px; }
    .google-btn {
      width: 100%;
      padding: 14px 24px;
      background: #FFFFFF;
      color: #1E1E2D;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all .2s;
      margin-bottom: 20px;
      text-decoration: none;
    }
    .google-btn:hover { background: #F0F0F0; transform: translateY(-1px); }
    .google-btn svg { width: 20px; height: 20px; }
    .divider {
      display: flex; align-items: center; gap: 16px;
      margin: 24px 0; color: #6B7082; font-size: 13px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #2A2D3E;
    }
    .demo-section h3 { font-size: 14px; color: #8E92A4; margin-bottom: 16px; }
    .demo-users { display: flex; flex-direction: column; gap: 10px; }
    .demo-user-btn {
      width: 100%;
      padding: 12px 20px;
      background: rgba(79,106,255,0.1);
      border: 1px solid rgba(79,106,255,0.3);
      color: #E4E6F0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all .2s;
    }
    .demo-user-btn:hover {
      background: rgba(79,106,255,0.2);
      border-color: #4F6AFF;
      transform: translateY(-1px);
    }
    .demo-user-btn .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 13px; color: white;
    }
    .demo-user-btn .info { text-align: left; }
    .demo-user-btn .name { font-weight: 600; }
    .demo-user-btn .role { font-size: 12px; color: #8E92A4; }
    .badge {
      margin-left: auto;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-leader { background: rgba(79,106,255,0.2); color: #4F6AFF; }
    .badge-member { background: rgba(34,211,167,0.2); color: #22D3A7; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">W</div>
    <h1>업무 종합 대시보드</h1>
    <p class="subtitle">팀 협업을 위한 올인원 업무 관리 플랫폼</p>

    <a href="/auth/google" class="google-btn">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google 계정으로 로그인
    </a>

    <div class="divider">또는 데모 계정</div>

    <div class="demo-section">
      <div class="demo-users" id="demo-users"></div>
    </div>
  </div>

  <script>
    const avatarColors = ['#4F6AFF','#22D3A7','#FF5C5C','#F59E0B','#8B5CF6'];
    const avatarInitials = ['SK','DL','JP','MJ','OC'];

    fetch('/auth/demo-users')
      .then(r => r.json())
      .then(users => {
        const container = document.getElementById('demo-users');
        users.forEach((u, i) => {
          const btn = document.createElement('button');
          btn.className = 'demo-user-btn';
          btn.innerHTML = `
            <div class="avatar" style="background:${avatarColors[i % 5]}">${avatarInitials[i % 5]}</div>
            <div class="info">
              <div class="name">${u.name}</div>
              <div class="role">${u.role === 'leader' ? '팀장' : '팀원'}</div>
            </div>
            <span class="badge badge-${u.role}">${u.role === 'leader' ? '팀장' : '팀원'}</span>
          `;
          btn.onclick = () => demoLogin(u.id);
          container.appendChild(btn);
        });
      });

    async function demoLogin(userId) {
      const resp = await fetch('/auth/demo-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId })
      });
      if (resp.ok) window.location.href = '/';
    }
  </script>
</body>
</html>
